services:
  cbt-latex:
    build: ./apps/latex-renderer
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [latex-network]
    # No published port, secrets, host mounts, or external network.

  # ─── 1. Scoring & IRT Service (FastAPI / Python) ───────────────────────────
  cbt-scoring:
    build:
      context: .
      dockerfile: apps/scoring/Dockerfile
    container_name: cbt-scoring
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - cbt-network
    # Port 8000 sengaja TIDAK dipublish ke host agar aman dari internet luar.
    # Service ini hanya diakses oleh cbt-api lewat jaringan internal Docker.

  # ─── 2. Backend API (NestJS 10 / Node.js) ──────────────────────────────────
  cbt-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cbt-api
    restart: unless-stopped
    depends_on:
      cbt-scoring:
        condition: service_started
      cbt-latex:
        condition: service_started
    env_file:
      - .env
    environment:
      - PORT=3009
      - HOST=0.0.0.0
      - SCORING_API_URL=http://cbt-scoring:8000
      - LATEX_RENDERER_URL=http://cbt-latex:8010
    # Memungkinkan container menjangkau PostgreSQL di host VPS lewat host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cbt-network
      - latex-network
    # Port 3009 sengaja TIDAK dipublish ke host. Hanya diakses oleh Next.js route handler.

  # ─── 3. Frontend Web (Next.js 16 / Standalone) ─────────────────────────────
  cbt-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_ACCA_URL=${NEXT_PUBLIC_ACCA_URL:-https://acca.icgowa.sch.id}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://acca-cbt.icgowa.sch.id}
    container_name: cbt-web
    restart: unless-stopped
    depends_on:
      cbt-api:
        condition: service_started
    env_file:
      - .env
    environment:
      - PORT=3008
      - HOSTNAME=0.0.0.0
      - NEST_API_URL=http://cbt-api:3009/api
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://acca-cbt.icgowa.sch.id}
      - NEXT_PUBLIC_ACCA_URL=${NEXT_PUBLIC_ACCA_URL:-https://acca.icgowa.sch.id}
    ports:
      # Hanya port ini yang diekspos ke host VPS untuk disambungkan ke Nginx/Reverse Proxy
      - "${CBT_WEB_PORT:-3008}:3008"
    networks:
      - cbt-network

networks:
  latex-network:
    internal: true
  cbt-network:
    name: cbt-network
    driver: bridge
