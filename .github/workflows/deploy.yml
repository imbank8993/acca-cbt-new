name: Build & Deploy ACCA CBT via Docker

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  # ── 1. Verifikasi Kode, Typecheck & Testing ─────────────────────────────────
  verify:
    name: Verify Tests & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/scoring/requirements.txt'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build:shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck Frontend (Next.js)
        run: npm run typecheck

      - name: Check Frontend Lint Baseline
        run: npm run lint:web:baseline

      - name: Run Security and Integrity Regression Tests
        run: npm run test:audit

      - name: Compile Backend (NestJS)
        run: npm run build:backend

      - name: Run Scoring Tests (FastAPI / Pytest)
        run: |
          pip install -r apps/scoring/requirements.txt pytest
          pytest apps/scoring/tests

  # ── 2. Build image Docker di GitHub (bukan di VPS) ──────────────────────────
  # Build Next.js/NestJS/Python/TeX Live dulu berjalan di VPS dan membuat CPU
  # penuh 10–20 menit setiap push, bahkan saat ujian. Sekarang image dibangun
  # di runner GitHub lalu disimpan di GitHub Container Registry (privat).
  build-images:
    name: Build image ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: scoring
            context: .
            dockerfile: apps/scoring/Dockerfile
          - service: latex
            context: apps/latex-renderer
            dockerfile: apps/latex-renderer/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Nilai NEXT_PUBLIC_* tertanam saat build: samakan Repository variables
          # GitHub dengan .env VPS bila domain berubah.
          build-args: |
            NEXT_PUBLIC_ACCA_URL=${{ vars.NEXT_PUBLIC_ACCA_URL || 'https://acca.icgowa.sch.id' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://acca-cbt.icgowa.sch.id' }}
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ── 3. Deploy ke VPS: hanya mengunduh image jadi, tanpa build ────────────────
  deploy:
    name: Deploy to VPS
    needs: build-images
    runs-on: ubuntu-latest
    # main and master deploy to the same VPS; do not interrupt a live rollout.
    concurrency:
      group: acca-cbt-production-vps
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          timeout: 30m
          envs: DEPLOY_GITHUB_TOKEN,DEPLOY_ACTOR,DEPLOY_REPOSITORY,DEPLOY_BRANCH,DEPLOY_SHA
          script: |
            set -e
            echo "🚀 Menghubungkan ke VPS..."
            TARGET_DIR="${{ secrets.VPS_APP_DIR || '/www/wwwroot/acca-cbt-new' }}"
            REPOSITORY_URL="https://github.com/$DEPLOY_REPOSITORY.git"

            # Also serialize remote scripts that outlive their Actions runner.
            # Lock before fetching: concurrent resets/rollouts share this checkout.
            command -v flock >/dev/null 2>&1 || {
              echo "flock diperlukan untuk mengunci proses deployment di VPS."
              exit 1
            }
            exec 9>/var/lock/acca-cbt-production-deploy.lock
            echo "⏳ Menunggu deployment lain selesai..."
            flock -w 1500 9 || {
              echo "Deployment lain masih berjalan; tidak ada kontainer yang diubah."
              exit 1
            }

            # Supply the job's read-only token only while fetching source.
            # The helper contains no token and is removed right after the fetch.
            : "${DEPLOY_GITHUB_TOKEN:?Token GitHub Actions tidak tersedia}"
            ASKPASS_FILE=$(mktemp)
            trap 'rm -f "$ASKPASS_FILE"' EXIT HUP INT TERM
            cat > "$ASKPASS_FILE" <<'ASKPASS'
            #!/bin/sh
            case "$1" in
              *Username*) printf '%s\n' 'x-access-token' ;;
              *Password*) printf '%s\n' "$DEPLOY_GITHUB_TOKEN" ;;
            esac
            ASKPASS
            chmod 700 "$ASKPASS_FILE"
            export GIT_ASKPASS="$ASKPASS_FILE"
            export GIT_TERMINAL_PROMPT=0

            if [ ! -d "$TARGET_DIR" ]; then
              echo "Direktori $TARGET_DIR belum ada, melakukan clone perdana..."
              mkdir -p "$(dirname "$TARGET_DIR")"
              git -c credential.helper= clone "$REPOSITORY_URL" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            echo "📥 Mengambil commit terbaru dari GitHub ($DEPLOY_BRANCH)..."
            git remote set-url origin "$REPOSITORY_URL"
            git -c credential.helper= fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            rm -f "$ASKPASS_FILE"
            trap - EXIT HUP INT TERM
            unset GIT_ASKPASS

            if [ ! -f ".env" ]; then
              echo "⚠️ PERINGATAN: File .env tidak ditemukan di $TARGET_DIR!"
              echo "Pastikan file .env sudah dibuat sebelum aplikasi dijalankan."
              exit 1
            fi

            # Image sudah dibangun GitHub Actions; VPS hanya mengunduh (tanpa build).
            # Login GHCR hanya selama pull; token job kedaluwarsa begitu job selesai.
            PREFIX="ghcr.io/$(printf '%s' "$DEPLOY_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export CBT_IMAGE_PREFIX="$PREFIX"
            printf '%s' "$DEPLOY_GITHUB_TOKEN" | docker login ghcr.io -u "$DEPLOY_ACTOR" --password-stdin
            unset DEPLOY_GITHUB_TOKEN

            echo "📦 Mengunduh image versi $DEPLOY_SHA..."
            CBT_IMAGE_TAG="$DEPLOY_SHA" docker compose pull cbt-latex cbt-scoring cbt-api cbt-web
            docker logout ghcr.io >/dev/null 2>&1 || true

            # Tandai versi ini sebagai :latest di VPS, supaya `docker compose up -d`
            # manual (mis. setelah reboot) memakai versi yang sama tanpa login/build.
            for service in latex scoring api web; do
              docker tag "$PREFIX-$service:$DEPLOY_SHA" "$PREFIX-$service:latest"
            done

            echo "🔄 Menjalankan kontainer versi terbaru..."
            # Sisa nama kontainer lama dari project compose sebelumnya.
            docker rm -f acca-cbt-new-cbt-latex-1 2>/dev/null || true
            # Hanya kontainer yang image-nya berubah yang dibuat ulang (beberapa detik),
            # tanpa mematikan semuanya lebih dulu.
            CBT_IMAGE_TAG=latest docker compose up -d --no-build --remove-orphans

            echo "🧹 Membersihkan image lama..."
            docker image prune -f
            # Simpan 3 versi terakhir per layanan untuk rollback cepat.
            for service in latex scoring api web; do
              docker images "$PREFIX-$service" --format '{{.Tag}} {{.ID}}' \
                | grep -v '^latest ' | tail -n +4 | awk '{print $2}' \
                | xargs -r docker rmi -f 2>/dev/null || true
            done

            echo "✅ Status kontainer saat ini:"
            docker compose ps
            echo "🎉 Deployment ACCA CBT selesai dengan sukses!"
