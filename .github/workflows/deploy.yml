name: Build & Deploy ACCA CBT via Docker

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  # ── 1. Verifikasi Kode, Typecheck & Testing ─────────────────────────────────
  verify:
    name: Verify Tests & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/scoring/requirements.txt'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build:shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Typecheck Frontend (Next.js)
        run: npm run typecheck

      - name: Check Frontend Lint Baseline
        run: npm run lint:web:baseline

      - name: Run Security and Integrity Regression Tests
        run: npm run test:audit

      - name: Compile Backend (NestJS)
        run: npm run build:backend

      - name: Run Scoring Tests (FastAPI / Pytest)
        run: |
          pip install -r apps/scoring/requirements.txt pytest
          pytest apps/scoring/tests

  # ── 2. Otomatis Deploy ke VPS via Docker ─────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD || secrets.SSH_PASSWORD }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          timeout: 30m
          script: |
            set -e
            echo "🚀 Menghubungkan ke VPS..."
            TARGET_DIR="${{ secrets.VPS_APP_DIR || '/www/wwwroot/acca-cbt-new' }}"

            if [ ! -d "$TARGET_DIR" ]; then
              echo "Direktori $TARGET_DIR belum ada, melakukan clone perdana..."
              mkdir -p "$(dirname "$TARGET_DIR")"
              git clone https://github.com/imbank8993/acca-cbt-new.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            echo "📥 Mengambil commit terbaru dari GitHub (${{ github.ref_name }})..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            if [ ! -f ".env" ]; then
              echo "⚠️ PERINGATAN: File .env tidak ditemukan di $TARGET_DIR!"
              echo "Pastikan file .env sudah dibuat sebelum aplikasi dijalankan."
              exit 1
            fi

            echo "🐳 Menjalankan build image Docker..."
            docker compose build

            echo "🔄 Me-restart kontainer ke versi terbaru..."
            docker compose down || true
            docker rm -f cbt-web cbt-api cbt-scoring 2>/dev/null || true
            docker compose up -d --remove-orphans

            echo "🧹 Membersihkan image lama yang menggantung..."
            docker image prune -f

            echo "✅ Status kontainer saat ini:"
            docker compose ps
            echo "🎉 Deployment ACCA CBT selesai dengan sukses!"
